<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua proposta de viagem — Voe Mais</title>
<style>
:root {
  --color-primary: #1045E8;
  --color-primary-deep: #1028C7;
  --color-accent: #159BFA;
  --color-bg: #F5F8FD;
  --color-surface: #FFFFFF;
  --color-text: #17233D;
  --color-text-2: #62708A;
  --color-border: #E3EAF5;
  --color-danger: #B42318;
  --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
}
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}
.cartao {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(16, 69, 232, 0.08);
  padding: 32px 28px;
  max-width: 360px;
  width: 100%;
  text-align: center;
}
.logo {
  width: 72px;
  height: 72px;
  margin: 0 auto 16px;
  display: block;
  object-fit: contain;
}
h1 {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 0 0 4px;
}
p.sub {
  color: var(--color-text-2);
  font-size: 0.85rem;
  margin: 0 0 24px;
}
.campos-pin {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 16px;
}
.campos-pin input {
  width: 44px;
  height: 52px;
  text-align: center;
  font-size: 1.4rem;
  font-weight: 600;
  border: 1.5px solid var(--color-border);
  border-radius: 10px;
  color: var(--color-text);
  background: var(--color-bg);
  font-family: var(--font-sans);
}
.campos-pin input:focus {
  outline: none;
  border-color: var(--color-primary);
  background: var(--color-surface);
}
.campos-pin input.erro-campo {
  border-color: var(--color-danger);
}
button#botao-abrir {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: var(--color-primary);
  color: white;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  font-family: var(--font-sans);
}
button#botao-abrir:hover { background: var(--color-primary-deep); }
button#botao-abrir:disabled { opacity: 0.6; cursor: wait; }
.erro {
  color: var(--color-danger);
  font-size: 0.82rem;
  margin-top: 12px;
  min-height: 1.2em;
}
.rodape {
  margin-top: 20px;
  font-size: 0.72rem;
  color: var(--color-text-2);
}
#invólucro-senha[hidden], #invólucro-proposta[hidden] { display: none !important; }
#invólucro-proposta {
  position: fixed;
  inset: 0;
  border: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
  <div id="invólucro-senha">
    <div class="cartao">
      <img class="logo" src="" alt="Voe Mais Viagens e Turismo" id="logo-marca">
      <h1>Sua proposta de viagem</h1>
      <p class="sub">Digite a senha de 4 dígitos que você recebeu junto com este link</p>
      <div class="campos-pin">
        <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="0">
        <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="1">
        <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="2">
        <input type="tel" inputmode="numeric" maxlength="1" autocomplete="off" data-pin="3">
      </div>
      <button type="button" id="botao-abrir">Abrir proposta</button>
      <div class="erro" id="mensagem-erro"></div>
      <div class="rodape">Voe Mais Viagens e Turismo</div>
    </div>
  </div>
  <iframe id="invólucro-proposta" hidden title="Proposta de viagem"></iframe>

(function () {
  const campos = Array.from(document.querySelectorAll('[data-pin]'));
  const botao = document.getElementById('botao-abrir');
  const mensagemErro = document.getElementById('mensagem-erro');
  const involucroSenha = document.getElementById('invólucro-senha');
  const involucroProposta = document.getElementById('invólucro-proposta');
  const logoMarca = document.getElementById('logo-marca');
  if (LOGO_ACESSO) logoMarca.src = LOGO_ACESSO;

  function senhaDigitada() {
    return campos.map((c) => c.value).join('');
  }

  function limparErro() {
    mensagemErro.textContent = '';
    campos.forEach((c) => c.classList.remove('erro-campo'));
  }

  function mostrarErro(texto) {
    mensagemErro.textContent = texto;
    campos.forEach((c) => c.classList.add('erro-campo'));
  }

  campos.forEach((campo, indice) => {
    campo.addEventListener('input', () => {
      campo.value = campo.value.replace(/\D/g, '').slice(0, 1);
      limparErro();
      if (campo.value && indice < campos.length - 1) {
        campos[indice + 1].focus();
      }
      if (campos.every((c) => c.value) && senhaDigitada().length === 4) {
        abrirProposta();
      }
    });
    campo.addEventListener('keydown', (evento) => {
      if (evento.key === 'Backspace' && !campo.value && indice > 0) {
        campos[indice - 1].focus();
      }
      if (evento.key === 'Enter') {
        abrirProposta();
      }
    });
    campo.addEventListener('paste', (evento) => {
      const texto = (evento.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      if (!texto) return;
      evento.preventDefault();
      texto.slice(0, 4).split('').forEach((digito, posicao) => {
        if (campos[posicao]) campos[posicao].value = digito;
      });
      const proximo = campos[Math.min(texto.length, 3)];
      if (proximo) proximo.focus();
      if (campos.every((c) => c.value) && senhaDigitada().length === 4) {
        abrirProposta();
      }
    });
  });

  botao.addEventListener('click', abrirProposta);

  function base64ParaBytes(base64) {
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i += 1) bytes[i] = binario.charCodeAt(i);
    return bytes;
  }

  async function derivarChave(senha, sal, iteracoes) {
    const chaveBase = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(senha),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: sal, iterations: iteracoes, hash: 'SHA-256' },
      chaveBase,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function abrirProposta() {
    const senha = senhaDigitada();
    if (senha.length !== 4) return;
    limparErro();
    botao.disabled = true;
    try {
      const sal = base64ParaBytes(PROPOSTA_CIFRADA.sal);
      const nonce = base64ParaBytes(PROPOSTA_CIFRADA.nonce);
      const cifrado = base64ParaBytes(PROPOSTA_CIFRADA.cifrado);
      const chave = await derivarChave(senha, sal, PROPOSTA_CIFRADA.iteracoes);
      const decifrado = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, chave, cifrado);
      const htmlProposta = new TextDecoder('utf-8').decode(decifrado);
      involucroProposta.srcdoc = htmlProposta;
      involucroSenha.hidden = true;
      involucroProposta.hidden = false;
    } catch (erro) {
      mostrarErro('Senha incorreta. Confira os 4 dígitos e tente de novo.');
      campos.forEach((c) => { c.value = ''; });
      campos[0].focus();
    } finally {
      botao.disabled = false;
    }
  }

  campos[0].focus();
})();
</script>
